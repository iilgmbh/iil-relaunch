name: Deploy iil.ai

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail

            REPO_DIR=/opt/iil-ai-repo
            PUBLIC_DIR=/opt/iil-ai/public
            REPO_URL=https://github.com/iilgmbh/iil-relaunch.git

            # Clone or pull latest (public repo — no auth needed).
            # Remote bei jedem Lauf auf REPO_URL setzen: Der Klon zeigte noch auf
            # achimdehnert/… per SSH-Deploy-Key, der nach dem Org-Umzug fehlt —
            # alle Deploys seit Mai 2026 scheiterten an "Permission denied (publickey)".
            if [ -d "$REPO_DIR/.git" ]; then
              cd $REPO_DIR
              git remote set-url origin "$REPO_URL"
              git pull --ff-only origin main
            else
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            # Nur die Website ausliefern (Positivliste): Seiten und apps.json.
            # Repo-Dateien wie AGENT_HANDOVER.md, CHANGELOG.md, serve.py oder
            # .windsurf/ gehoeren nicht in den Webroot; --delete-excluded raeumt
            # dort liegende Altbestaende mit ab.
            mkdir -p $PUBLIC_DIR
            rsync -a --delete --delete-excluded \
              --include='*.html' \
              --include='apps.json' \
              --exclude='*' \
              $REPO_DIR/ $PUBLIC_DIR/

            # Reload nginx
            nginx -t && systemctl reload nginx
            echo "✅ iil.ai deployed at $(date)"

      - name: Health check
        run: |
          sleep 5
          curl -fsS --retry 3 --retry-delay 5 https://iil.ai/healthz
          curl -fsS --retry 3 --retry-delay 5 -o /dev/null https://iil.ai/impressum
